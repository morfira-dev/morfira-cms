name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install release dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: docker compose run --rm --no-deps composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        run: docker compose run --build --rm --no-deps front pnpm install --frozen-lockfile

      - name: Verify dependency licenses
        run: pnpm run licenses:check

      - name: Verify backend
        run: docker compose run --rm --no-deps composer check

      - name: Verify frontend
        run: docker compose run --rm --no-deps front pnpm run check

      - name: Verify production browser journey
        env:
          CMS_TEST_WORDPRESS_IMPORT: '1'
        run: ./scripts/test-e2e.sh

  release:
    name: Publish release
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install release dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: pnpm run release

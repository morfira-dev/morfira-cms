openapi: 3.1.0
info:
  title: Morfira CMS API
  version: 1.11.0
  description: Stable HTTP contract shared by Admin Studio and headless clients.
servers:
  - url: /
tags:
  - name: Admin Content
    description: Authoring operations available to authenticated editors.
  - name: Publishing
    description: Promote an exact draft revision to an immutable delivery snapshot.
  - name: Delivery
    description: Public headless delivery of published snapshots only.
  - name: Identity
    description: First-owner setup and session authentication.
  - name: Media
    description: Upload and reuse immutable, safely re-encoded image assets.
  - name: SEO
    description: Search-engine discovery documents generated from active published snapshots.
  - name: Navigation
    description: Versioned navigation drafts and immutable public menu snapshots.
  - name: Content Schema
    description: Versioned custom content-type definitions.
  - name: Entries
    description: Schema-validated custom content drafts and immutable published snapshots.
paths:
  /ready:
    get:
      operationId: getReadiness
      tags: [Delivery]
      summary: Check whether the application and database are ready to serve traffic
      security: []
      responses:
        '200':
          description: Application and database are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: A required service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      tags: [Identity]
      summary: Check whether the first owner must be created
      responses:
        '200':
          description: Current installation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
    post:
      operationId: setupOwner
      tags: [Identity]
      summary: Atomically create the first CMS owner
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupOwnerRequest'
      responses:
        '201':
          description: Owner created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '409':
          description: The CMS has already been configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Identity]
      summary: Issue a session-bound CSRF token
      responses:
        '200':
          description: CSRF token for subsequent mutations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Identity]
      summary: Start an authenticated editor session
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many login attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/me:
    get:
      operationId: getAuthenticatedUser
      tags: [Identity]
      summary: Get the current authenticated user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/preferences:
    put:
      operationId: updateAuthenticatedUserPreferences
      tags: [Identity]
      summary: Update the authenticated user's Admin Studio preferences
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminPreferencesRequest'
      responses:
        '200':
          description: Updated Admin Studio preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPreferences'
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unsupported Admin Studio locale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Identity]
      summary: End the authenticated session
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204':
          description: Session ended.
  /api/v1/auth/password:
    put:
      operationId: changePassword
      tags: [Identity]
      summary: Change the authenticated user's password
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed and the current session ended.
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Current password is incorrect or the new password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/settings:
    get:
      operationId: getSiteSettings
      tags: [Settings]
      summary: Read site identity and regional defaults
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current site settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
    put:
      operationId: updateSiteSettings
      tags: [Settings]
      summary: Update site identity and regional defaults
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteSettingsRequest'
      responses:
        '200':
          description: Updated site settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
        '403':
          description: Owner access is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Settings changed since they were loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid site settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/users:
    get:
      operationId: listUsers
      tags: [Identity]
      summary: List CMS users
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Safe user summaries ordered by creation time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCollection'
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The authenticated user is not an owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createUser
      tags: [Identity]
      summary: Create a CMS user
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The authenticated user is not an owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The normalized email address already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid or unexpected input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateUserRole
      tags: [Identity]
      summary: Change another user's role
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: User role changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The authenticated user is not an owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Self-demotion or final-owner demotion was refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid or unexpected input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteUser
      tags: [Identity]
      summary: Remove another CMS user
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204':
          description: User removed.
        '401':
          description: No authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The authenticated user is not an owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Self-deletion or final-owner removal was refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/media:
    get:
      operationId: listMedia
      tags: [Media]
      summary: List image assets
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Image assets ordered from newest to oldest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetCollection'
        '401':
          description: No authenticated editor session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: uploadMedia
      tags: [Media]
      summary: Upload and safely re-encode an image
      description: >-
        Accepts JPEG, PNG or WebP input up to 10 MiB. The server validates the
        decoded image instead of trusting the client MIME type, strips metadata,
        and creates immutable WebP variants. SVG input is not accepted.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadMediaRequest'
      responses:
        '201':
          description: Image validated, re-encoded and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          description: No authenticated editor session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File exceeds the 10 MiB upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: File is not a supported JPEG, PNG or WebP image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The image cannot be decoded or the alt text is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/media/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateMediaMetadata
      tags: [Media]
      summary: Update mutable media organization metadata
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMediaMetadataRequest'
      responses:
        '200':
          description: Metadata updated without changing immutable image bytes or URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '404':
          description: Media asset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteMedia
      tags: [Media]
      summary: Delete an unreferenced media asset and its immutable files
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204':
          description: Media asset deleted.
        '404':
          description: Media asset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Media asset is retained by draft, revision, or published content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetInUseError'
  /api/v1/admin/themes:
    get:
      operationId: listThemes
      tags: [Themes]
      summary: List trusted installed theme packages
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Registered theme catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThemeCollection' }
  /api/v1/admin/extensions:
    get:
      operationId: listExtensions
      tags: [Extensions]
      summary: List trusted container-registered extensions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Compatible enabled extension catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionCollection' }
        '403': { description: Owner role required. }
  /api/v1/admin/sections:
    get:
      operationId: listReusableSections
      tags: [Admin Content]
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Reusable sections ordered by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReusableSectionCollection' }
    post:
      operationId: createReusableSection
      tags: [Admin Content]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfTokenHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReusableSectionRequest' }
      responses:
        '201':
          description: Section created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReusableSection' }
        '409': { description: Section name conflict. }
        '422': { description: Invalid name or blocks. }
  /api/v1/admin/sections/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateReusableSection
      tags: [Admin Content]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfTokenHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateReusableSectionRequest' }
      responses:
        '200':
          description: Section revised.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReusableSection' }
        '404': { description: Section not found. }
        '409': { description: Stale version or name conflict. }
    delete:
      operationId: deleteReusableSection
      tags: [Admin Content]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfTokenHeader' }]
      responses:
        '204': { description: Section deleted. }
        '404': { description: Section not found. }
  /api/v1/admin/pages:
    get:
      operationId: listPages
      tags: [Admin Content]
      summary: List pages
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Pages ordered from newest to oldest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCollection'
    post:
      operationId: createPage
      tags: [Admin Content]
      summary: Create a page draft
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePageRequest'
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '409':
          description: The slug is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The request does not satisfy content rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/pages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPage
      tags: [Admin Content]
      summary: Read a page draft
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current draft revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '404':
          description: Page not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updatePage
      tags: [Admin Content]
      summary: Save a new page revision
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePageRequest'
      responses:
        '200':
          description: Revision saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '404':
          description: Page not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug collision or optimistic locking conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid page or block data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deletePage
      tags: [Admin Content]
      summary: Permanently delete a page draft while retaining publication snapshots
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204':
          description: Page draft, revisions, routes, redirects and schedules were deleted.
        '404':
          description: Page not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid page identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/pages/{id}/revisions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listPageRevisions
      tags: [Admin Content]
      summary: List immutable page revisions newest first
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Complete page revision history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageRevisionCollection'
        '404':
          description: Page not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/pages/{id}/revisions/{revision}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: revision, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: restorePageRevision
      tags: [Admin Content]
      summary: Restore a historical page payload as a new revision
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfTokenHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestorePageRevisionRequest'
      responses:
        '200':
          description: New current page revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '404':
          description: Page or revision not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Current version conflict or slug collision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/pages/{id}/redirects/{sourceSlug}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: sourceSlug, in: path, required: true, schema: { type: string, maxLength: 191, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } }
    delete:
      operationId: deletePageRedirect
      tags: [Publishing]
      summary: Delete one permanent redirect owned by a page
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfTokenHeader' }]
      responses:
        '204': { description: Redirect is absent. }
        '404': { description: Page not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Invalid identifier or source slug, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/admin/pages/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: publishPage
      tags: [Publishing]
      summary: Publish an exact draft revision
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishPageRequest'
      responses:
        '200':
          description: Existing idempotent snapshot or newly published snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedPage'
        '404':
          description: Draft page not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale version or public slug collision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid publication request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: unpublishPage
      tags: [Publishing]
      summary: Remove the active public page route while preserving snapshots
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '204':
          description: Page is unpublished and any pending schedule is cancelled.
        '404':
          description: Draft page not found.
          content:
            application/json:
              schema:

              id: { type: string }
              name: { type: string }
        regions: { type: array, items: { type: string } }
    ThemeCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Theme' } }
    Extension:
      type: object
      additionalProperties: false
      required: [id, name, version, provider, apiVersion, capabilities, status]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }

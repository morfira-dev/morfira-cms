      properties:
        revision: { type: integer, minimum: 1 }
        title: { type: string }
        slug: { type: string }
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/PageBlock'
        seo:
          $ref: '#/components/schemas/PageSeo'
        layout:
          $ref: '#/components/schemas/PageLayout'
        createdAt: { type: string, format: date-time }
        locale: { $ref: '#/components/schemas/Locale' }
        translationGroupId: { type: string, format: uuid }
    PageRevisionCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PageRevision'
    RestorePageRevisionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    PublishedPage:
      type: object
      additionalProperties: false
      required: [snapshotId, pageId, sourceRevision, title, slug, blocks, seo, layout, publishedAt, locale, translationGroupId, url, alternates]
      properties:
        snapshotId:
          type: string
          format: uuid
        pageId:
          type: string
          format: uuid
        sourceRevision:
          type: integer
          minimum: 1
        title:
          type: string
        slug:
          type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/PageBlock'
        seo:
          $ref: '#/components/schemas/PageSeo'
        layout:
          $ref: '#/components/schemas/PageLayout'
        publishedAt:
          type: string
          format: date-time
        locale:
          $ref: '#/components/schemas/Locale'
        translationGroupId:
          type: string
          format: uuid
        url:
          type: string
          format: uri-reference
        alternates:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedPageLink'
    Locale:
      type: string
      pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'
      examples: [en, ru-RU]
    LocalizedPageLink:

      responses:
        '200': { description: Updated taxonomy, content: { application/json: { schema: { $ref: '#/components/schemas/Taxonomy' } } } }
        '404': { description: Taxonomy or term not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Term still has children, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/admin/entries/{id}/terms:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      operationId: getEntryTerms
      tags: [Entries]
      summary: Get entry term assignments
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Assigned terms.
          content: { application/json: { schema: { $ref: '#/components/schemas/TaxonomyTermCollection' } } }
    put:
      operationId: putEntryTerms
      tags: [Entries]
      summary: Replace entry term assignments
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfTokenHeader' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PutEntryTermsRequest' } } }
      responses:
        '200':
          description: Assigned terms.
          content: { application/json: { schema: { $ref: '#/components/schemas/TaxonomyTermCollection' } } }
        '404': { description: Entry or term not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Invalid assignment, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/admin/navigation:
    get:
      operationId: listNavigationMenus
      tags: [Navigation]
      summary: List navigation drafts
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Navigation drafts ordered from newest to oldest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationMenuCollection'
        '401':
          description: No authenticated editor session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createNavigationMenu
      tags: [Navigation]
      summary: Create a navigation draft
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNavigationMenuRequest'
      responses:
        '201':
          description: Navigation draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationMenu'
        '401':
          description: No authenticated editor session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The navigation code is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid navigation name, code or item tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/navigation/{id}:
    parameters:
      - $ref: '#/components/parameters/NavigationId'
    get:
      operationId: getNavigationMenu
      tags: [Navigation]
      summary: Read a navigation draft
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current navigation draft revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationMenu'
        '401':
          description: No authenticated editor session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Navigation menu not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateNavigationMenu
      tags: [Navigation]
      summary: Save a new navigation draft revision
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNavigationMenuRequest'
      responses:
        '200':
          description: Navigation revision saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationMenu'
        '401':
          description: No authenticated editor session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Navigation menu not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Navigation code collision or optimistic locking conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid navigation name, code or item tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/navigation/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/NavigationId'
    post:
      operationId: publishNavigationMenu
      tags: [Navigation]
      summary: Publish an exact navigation draft version
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishNavigationMenuRequest'
      responses:
        '200':
          description: Existing idempotent snapshot or newly published snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedNavigationMenu'
        '401':
          description: No authenticated editor session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Navigation menu not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale version or public navigation code collision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid publication request or navigation item tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/content/navigation/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/NavigationCode'
    get:
      operationId: getPublishedNavigationMenu
      tags: [Navigation, Delivery]
      summary: Get the active published navigation snapshot
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Active immutable navigation snapshot.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedNavigationMenu'
        '304':
          description: The supplied entity tag still identifies the active snapshot.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          description: No published navigation snapshot exists for this code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/content/entries/{type}:
    parameters:
      - $ref: '#/components/parameters/ContentTypeApiName'
    get:
      operationId: listPublishedEntries
      tags: [Entries, Delivery]
      summary: List active published entry snapshots for a content type
      parameters:
        - name: taxonomy
          in: query
          schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
          description: Taxonomy slug; must be supplied together with term.
        - name: term
          in: query
          schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
          description: Term slug; must be supplied together with taxonomy.
        - $ref: '#/components/parameters/PublicEntriesLimit'
        - $ref: '#/components/parameters/PublicEntriesOffset'
      responses:
        '200':
          description: Paginated active published entry snapshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedEntryCollection'
        '422':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/content/entries/{type}/{slug}:
    parameters:
      - $ref: '#/components/parameters/ContentTypeApiName'
      - name: slug
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntrySlug'
    get:
      operationId: getPublishedEntry
      tags: [Entries, Delivery]
      summary: Get one active published entry snapshot
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Active immutable entry snapshot.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedEntry'
        '304':
          description: The supplied entity tag still identifies the active snapshot.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          description: No active published entry exists for this type and slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/content/pages/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    get:
      operationId: getPublishedPage
      tags: [Delivery]
      summary: Get the active published page snapshot
      responses:
        '200':
          description: Published delivery snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedPage'
        '301':
          description: This historical slug permanently redirects to the page's active slug.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
        '404':
          description: No published snapshot exists for this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/content/pages/{locale}/{slug}:
    parameters:
      - { name: locale, in: path, required: true, schema: { $ref: '#/components/schemas/Locale' } }
      - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } }
    get:
      operationId: getLocalizedPublishedPage
      tags: [Delivery]
      summary: Get an active locale-prefixed published page snapshot
      responses:
        '200':
          description: Localized immutable delivery snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedPage' }
        '301': { description: Historical localized path redirect. }
        '404': { description: No active localized page exists. }
  /robots.txt:
    get:
      operationId: getRobotsTxt
      tags: [SEO]
      summary: Get crawler directives and the sitemap location
      responses:
        '200':
          description: Plain-text crawler policy.
          content:
            text/plain:
              schema:
                type: string
  /sitemap.xml:
    get:
      operationId: getSitemap
      tags: [SEO]
      summary: List indexable active publication snapshots
      responses:
        '200':
          description: XML sitemap excluding pages marked noIndex.
          content:
            application/xml:
              schema:
                type: string
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: CMSSESSID
      description: HttpOnly same-site editor session cookie.
  parameters:
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound token obtained from `/api/v1/auth/csrf`.
      schema:
        type: string
    NavigationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContentTypeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryContentTypeId:
      name: contentTypeId
      in: query
      required: true
      description: Restricts the admin list to drafts of one content type.
      schema:
        type: string
        format: uuid
    ContentTypeApiName:
      name: type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ContentTypeApiName'
    PublicEntriesLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PublicEntriesOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Entity tag from a previous immutable public response.
      schema:
        type: string
  headers:
    ETag:
      required: true
      description: Quoted immutable snapshot identifier used for conditional reads.
      schema:
        type: string
        example: '"019db391-89cb-7d2f-9aa0-9cd4765d9125"'
  schemas:
    SetupStatus:
      type: object
      additionalProperties: false
      required: [required]
      properties:
        required:
          type: boolean
    SetupOwnerRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 12
    SiteSettings:
      type: object
      additionalProperties: false
      required: [siteName, defaultLocale, timezone, version, updatedAt]
      properties:
        siteName: { type: string, minLength: 1, maxLength: 120 }
        defaultLocale: { type: string, pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$' }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    UpdateSiteSettingsRequest:
      type: object
      additionalProperties: false
      required: [siteName, defaultLocale, timezone, version]
      properties:
        siteName: { type: string, minLength: 1, maxLength: 120 }
        defaultLocale: { type: string, pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$' }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        version: { type: integer, minimum: 1 }
    AuthenticatedUser:
      type: object
      additionalProperties: false
      required: [id, email, roles, adminLocale]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
            enum: [ROLE_OWNER, ROLE_EDITOR]
        adminLocale:
          $ref: '#/components/schemas/AdminLocale'
    AdminLocale:
      type: string
      enum: [en, ru]
    UpdateAdminPreferencesRequest:
      type: object
      additionalProperties: false
      required: [adminLocale]
      properties:
        adminLocale:
          $ref: '#/components/schemas/AdminLocale'
    AdminPreferences:
      type: object
      additionalProperties: false
      required: [adminLocale]
      properties:
        adminLocale:
          $ref: '#/components/schemas/AdminLocale'
    UserRole:
      type: string
      enum: [owner, editor]
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
    UserCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
        role:
          $ref: '#/components/schemas/UserRole'
    UpdateUserRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    ContentTypeApiName:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
    ContentField:
      type: object
      additionalProperties: false
      required: [id, key, label, type, required]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[a-z][a-zA-Z0-9]*$'
        label:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          enum: [text, textarea, richText, number, boolean, date, media, relation]
          description: >-
            Determines value validation: text is a string of at most 255
            characters; textarea is a string of at most 20000 characters;
            richText is a server-sanitized HTML string of at most 20000 characters;
            number is a JSON number; boolean is a JSON boolean; date is an ISO
            calendar-date string (YYYY-MM-DD); media is a media asset UUID string;
            relation is one entry UUID or, when multiple is true, an ordered UUID
            list for the declared target content type.
        required:
          type: boolean
        targetContentTypeId:
          type: [string, 'null']
          format: uuid
          description: Required only when type is relation.
        multiple:
          type: boolean
          description: Only valid for relation fields. When true, the value is an ordered list of up to 100 unique entry UUIDs.
    ContentFieldCollection:
      type: array
      maxItems: 50
      description: Field identifiers and keys must each be unique within the content type.
      items:
        $ref: '#/components/schemas/ContentField'
    CreateContentTypeRequest:
      type: object
      additionalProperties: false
      required: [name, apiName, fields]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        apiName:
          $ref: '#/components/schemas/ContentTypeApiName'
        fields:
          $ref: '#/components/schemas/ContentFieldCollection'
    UpdateContentTypeRequest:
      type: object
      additionalProperties: false
      required: [name, apiName, fields, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        apiName:
          $ref: '#/components/schemas/ContentTypeApiName'
        fields:
          $ref: '#/components/schemas/ContentFieldCollection'
        version:
          type: integer
          minimum: 1
          description: Optimistic-lock version read from the current schema.
    ContentType:
      type: object
      additionalProperties: false
      required: [id, name, apiName, fields, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        apiName:
          $ref: '#/components/schemas/ContentTypeApiName'
        fields:
          $ref: '#/components/schemas/ContentFieldCollection'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContentTypeCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentType'
    EntrySlug:
      type: string
      minLength: 1
      maxLength: 191
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    EntryValue:
      description: >-
        Value validated against its content field. Date and media values are strings
        containing an ISO calendar date and media asset UUID respectively. String
        length is additionally constrained by the field type: text allows at most
        255 characters, while textarea and richText allow at most 20000 characters.
        richText strings contain server-sanitized HTML. Multiple relation fields use
        an ordered list of up to 100 unique entry UUIDs.
      oneOf:
        - type: string
          maxLength: 20000
        - type: number
        - type: boolean
        - type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        - type: 'null'
    EntryValues:
      type: object
      description: >-
        Keys must exactly match defined schema fields. Unknown keys are rejected;
        required fields must be present and non-null.
      additionalProperties:
        $ref: '#/components/schemas/EntryValue'
    CreateEntryRequest:
      type: object
      additionalProperties: false
      required: [contentTypeId, title, slug, values]
      properties:
        contentTypeId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: '#/components/schemas/EntrySlug'
        values:
          $ref: '#/components/schemas/EntryValues'
    UpdateEntryRequest:
      type: object
      additionalProperties: false
      required: [title, slug, values, version]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: '#/components/schemas/EntrySlug'
        values:
          $ref: '#/components/schemas/EntryValues'
        version:
          type: integer
          minimum: 1
          description: Optimistic-lock version read from the current draft.
    PublishEntryRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: Exact entry version to publish.
    Entry:
      type: object
      additionalProperties: false
      required: [id, contentTypeId, title, slug, values, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        contentTypeId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: '#/components/schemas/EntrySlug'
        values:
          $ref: '#/components/schemas/EntryValues'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EntryCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
    EntryReference:
      type: object
      additionalProperties: false
      required: [id, contentTypeId, title, fieldKey]
      properties:
        id:
          type: string
          format: uuid
        contentTypeId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        fieldKey:
          type: string
          minLength: 1
          maxLength: 120
    EntryReferenceCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntryReference'
    EntryRevision:
      type: object
      additionalProperties: false
      required: [revision, title, slug, values, createdAt]
      properties:
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: '#/components/schemas/EntrySlug'
        values:
          $ref: '#/components/schemas/EntryValues'
        createdAt:
          type: string
          format: date-time
    EntryRevisionCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntryRevision'
    RestoreEntryRevisionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
    PublishedContentType:
      type: object
      additionalProperties: false
      required: [id, name, apiName, version, fields]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        apiName:
          $ref: '#/components/schemas/ContentTypeApiName'
        version:
          type: integer
          minimum: 1
        fields:
          $ref: '#/components/schemas/ContentFieldCollection'
    PublishedEntry:
      type: object
      additionalProperties: false
      required: [snapshotId, entryId, sourceVersion, contentType, title, slug, values, publishedAt]
      properties:
        snapshotId:
          type: string
          format: uuid
        entryId:
          type: string
          format: uuid
        sourceVersion:
          type: integer
          minimum: 1
        contentType:
          $ref: '#/components/schemas/PublishedContentType'
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          $ref: '#/components/schemas/EntrySlug'
        values:
          $ref: '#/components/schemas/EntryValues'
        taxonomies:
          type: array
          items:
            $ref: '#/components/schemas/PublishedTaxonomyTerm'
        publishedAt:
          type: string
          format: date-time
    PublishedEntryCollection:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublishedEntry'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    CreateTaxonomyRequest:
      type: object
      additionalProperties: false
      required: [name, slug, hierarchical]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        hierarchical: { type: boolean }
    CreateTaxonomyTermRequest:
      type: object
      additionalProperties: false
      required: [name, slug, parentId]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, maxLength: 120, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        parentId: { type: [string, 'null'], format: uuid }
    PutEntryTermsRequest:
      type: object
      additionalProperties: false
      required: [termIds]
      properties:
        termIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    TaxonomyTerm:
      type: object
      additionalProperties: false
      required: [id, taxonomyId, name, slug, parentId, createdAt]
      properties:
        id: { type: string, format: uuid }
        taxonomyId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        parentId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    TaxonomyTermCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } }
    Taxonomy:
      type: object
      additionalProperties: false
      required: [id, name, slug, hierarchical, createdAt, terms]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        hierarchical: { type: boolean }
        createdAt: { type: string, format: date-time }
        terms: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } }
    TaxonomyCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Taxonomy' } }
    PublishedTaxonomyTerm:
      type: object
      additionalProperties: false
      required: [taxonomyId, taxonomySlug, termId, termSlug, name]
      properties:
        taxonomyId: { type: string, format: uuid }
        taxonomySlug: { type: string }
        termId: { type: string, format: uuid }
        termSlug: { type: string }
        name: { type: string }
    NavigationCode:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    NavigationHref:
      oneOf:
        - type: string
          maxLength: 2048
          pattern: '^/(?!/).*$'
          description: Root-relative URL beginning with one slash.
        - type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://'
          description: Absolute HTTP or HTTPS URL.
    NavigationItem:
      type: object
      additionalProperties: false
      description: >-
        Ordered navigation node. The complete tree is limited to three levels
        including root items and 100 items in total.
      required: [id, label, href, openInNewTab, children]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 120
        href:
          $ref: '#/components/schemas/NavigationHref'
        openInNewTab:
          type: boolean
        children:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NavigationItem'
    NavigationItemTree:
      type: array
      maxItems: 100
      description: >-
        Ordered root items. Across this recursive tree there may be at most 100
        items and at most three levels; the application validates both aggregate rules.
      items:
        $ref: '#/components/schemas/NavigationItem'
    CreateNavigationMenuRequest:
      type: object
      additionalProperties: false
      required: [name, code, items]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        code:
          $ref: '#/components/schemas/NavigationCode'
        items:
          $ref: '#/components/schemas/NavigationItemTree'
    UpdateNavigationMenuRequest:
      type: object
      additionalProperties: false
      required: [name, code, items, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        code:
          $ref: '#/components/schemas/NavigationCode'
        items:
          $ref: '#/components/schemas/NavigationItemTree'
        version:
          type: integer
          minimum: 1
          description: Optimistic-lock version read from the current draft.
    PublishNavigationMenuRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: Exact draft version to publish.
    NavigationMenu:
      type: object
      additionalProperties: false
      required: [id, name, code, items, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        code:
          $ref: '#/components/schemas/NavigationCode'
        items:
          $ref: '#/components/schemas/NavigationItemTree'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NavigationMenuCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NavigationMenu'
    PublishedNavigationMenu:
      type: object
      additionalProperties: false
      required: [snapshotId, navigationId, sourceVersion, name, code, items, publishedAt]
      properties:
        snapshotId:
          type: string
          format: uuid
        navigationId:
          type: string
          format: uuid
        sourceVersion:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
        code:
          $ref: '#/components/schemas/NavigationCode'
        items:
          $ref: '#/components/schemas/NavigationItemTree'
        publishedAt:
          type: string
          format: date-time
    CreatePageRequest:
      type: object
      additionalProperties: false
      required: [title, slug]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 191
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        locale:
          $ref: '#/components/schemas/Locale'
        translationGroupId:
          type: string
          format: uuid
    UpdatePageRequest:
      type: object
      additionalProperties: false
      required: [title, slug, blocks, seo, layout, version, locale, translationGroupId]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          maxLength: 191
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/PageBlock'
        seo:
          $ref: '#/components/schemas/PageSeo'
        layout:
          $ref: '#/components/schemas/PageLayout'
        version:
          type: integer
          minimum: 1
        locale:
          $ref: '#/components/schemas/Locale'
        translationGroupId:
          type: string
          format: uuid
    PublishPageRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
    PageBlock:
      oneOf:
        - $ref: '#/components/schemas/HeroBlock'
        - $ref: '#/components/schemas/RichTextBlock'
        - $ref: '#/components/schemas/ImageBlock'
      discriminator:
        propertyName: type
        mapping:
          hero: '#/components/schemas/HeroBlock'
          richText: '#/components/schemas/RichTextBlock'
          image: '#/components/schemas/ImageBlock'
    PageLayout:
      type: object
      additionalProperties: false
      required: [theme, template, headerNavigationCode, footerNavigationCode]
      properties:
        theme:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        template:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        headerNavigationCode:
          oneOf:
            - $ref: '#/components/schemas/NavigationCode'
            - type: 'null'
        footerNavigationCode:
          oneOf:
            - $ref: '#/components/schemas/NavigationCode'
            - type: 'null'
    HeroBlock:
      type: object
      additionalProperties: false
      required: [id, type, data]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: hero
        data:
          type: object
          additionalProperties: false
          required: [heading]
          properties:
            heading:
              type: string
              minLength: 1
              maxLength: 120
            text:
              type: string
              maxLength: 500
    RichTextBlock:
      type: object
      additionalProperties: false
      required: [id, type, data]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: richText
        data:
          type: object
          additionalProperties: false
          required: [content]
          properties:
            content:
              type: string
              minLength: 1
              maxLength: 20000
              description: Server-sanitized HTML limited to the supported rich-text element and link subset.
    ImageBlock:
      type: object
      additionalProperties: false
      required: [id, type, data]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: image
        data:
          type: object
          additionalProperties: false
          required: [assetId, alt]
          properties:
            assetId:
              type: string
              format: uuid
            alt:
              type: string
              minLength: 1
              maxLength: 300
            caption:
              type: string
              maxLength: 500
    UploadMediaRequest:
      type: object
      additionalProperties: false
      required: [file, alt]
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG or WebP image, at most 10 MiB.
        alt:
          type: string
          maxLength: 500
          description: Default alternative text copied when inserting the asset into a page.
    UpdateMediaMetadataRequest:
      type: object
      additionalProperties: false
      required: [defaultAlt, collection, tags]
      properties:
        defaultAlt:
          type: string
          maxLength: 500
        collection:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 120
            - type: 'null'
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
            maxLength: 50
    MediaVariant:
      type: object
      additionalProperties: false
      required: [url, width, height]
      properties:
        url:
          type: string
          format: uri-reference
          description: Stable public URL whose content never changes.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    MediaAsset:
      type: object
      additionalProperties: false
      required: [id, originalName, mimeType, size, width, height, defaultAlt, collection, tags, variants, createdAt]
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          const: image/webp
          description: MIME type of the canonical safely re-encoded asset.
        size:
          type: integer
          minimum: 1
          description: Canonical encoded asset size in bytes.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        defaultAlt:
          type: string
          maxLength: 500
        collection:
          oneOf:
            - type: string
            - type: 'null'
        tags:
          type: array
          items:
            type: string
        variants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MediaVariant'
        createdAt:
          type: string
          format: date-time
    MediaAssetCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
    MediaAssetInUseError:
      type: object
      additionalProperties: false
      required: [error, usages]
      properties:
        error:
          type: string
        usages:
          type: array
          items:
            type: string
    Readiness:
      type: object
      additionalProperties: false
      required: [status, service, database]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        service:
          type: string
          const: cms
        database:
          type: string
          enum: [ready, unavailable]
    PageSeo:
      type: object
      additionalProperties: false
      required: [title, description, noIndex, openGraphImageAssetId]
      properties:
        title:
          type: string
          maxLength: 70
          description: Optional search/social title; the page title is used when empty.
        description:
          type: string
          maxLength: 170
        noIndex:
          type: boolean
          description: Adds noindex directives and excludes the page from the sitemap.
        openGraphImageAssetId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: Optional immutable media asset used for social sharing cards.
    CreatePublishedRedirectRequest:
      type: object
      additionalProperties: false
      required: [sourceSlug]
      properties:
        sourceSlug: { type: string, maxLength: 191, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    PublishedRedirect:
      type: object
      additionalProperties: false
      required: [sourceSlug, targetSlug]
      properties:
        sourceSlug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        targetSlug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    PublishedRedirectCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublishedRedirect'
    Page:
      type: object
      additionalProperties: false
      required: [id, title, slug, status, blocks, seo, layout, version, createdAt, updatedAt, locale, translationGroupId]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft]
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/PageBlock'
        seo:
          $ref: '#/components/schemas/PageSeo'
        layout:
          $ref: '#/components/schemas/PageLayout'
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        locale:
          $ref: '#/components/schemas/Locale'
        translationGroupId:
          type: string
          format: uuid
    PageCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Page'
    PageRevision:
      type: object

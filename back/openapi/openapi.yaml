        status: { type: string, enum: [enabled] }
    ExtensionCollection:
      type: object
      additionalProperties: false
      required: [apiVersion, items]
      properties:
        apiVersion: { type: integer, const: 1 }
        items: { type: array, items: { $ref: '#/components/schemas/Extension' } }
    ReusableSection:
      type: object
      additionalProperties: false
      required: [id, name, blocks, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        blocks: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PageBlock' } }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReusableSectionCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReusableSection' } }
    CreateReusableSectionRequest:
      type: object
      additionalProperties: false
      required: [name, blocks]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        blocks: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PageBlock' } }
    UpdateReusableSectionRequest:
      allOf:
        - $ref: '#/components/schemas/CreateReusableSectionRequest'
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 1 }
    PutPublicationScheduleRequest:
      type: object
      additionalProperties: false
      required: [sourceVersion, scheduledAt]
      properties:
        sourceVersion:
          type: integer
          minimum: 1
          description: Exact page revision or entry version to publish.
        scheduledAt:
          type: string
          format: date-time
          description: Future RFC 3339 publication time. It is normalized to UTC.
    PublicationSchedule:
      type: object
      additionalProperties: false
      required: [id, targetType, targetId, sourceVersion, scheduledAt, status, failureReason, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          type: string
          enum: [page, entry]
        targetId:
          type: string
          format: uuid
        sourceVersion:
          type: integer
          minimum: 1
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, completed, failed, cancelled]
        failureReason:
          type: [string, 'null']
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
